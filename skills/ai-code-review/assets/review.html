<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f5f4">
<title>Review Desk · AI Code Review</title>
<link rel="stylesheet" href="https://unpkg.com/antd@5.27.4/dist/reset.css">
<link rel="stylesheet" href="https://unpkg.com/highlight.js@11.11.1/styles/github.min.css">
<link rel="stylesheet" href="https://unpkg.com/diff2html@3.4.56/bundles/css/diff2html.min.css">
<style>
/* 布局：顶栏（身份 + 交接动作）→ 交接预览 | 问题构成 → 问题队列（主工作面）→ 已关闭。
   详情是全屏工作单：左侧按 问题 → 分析 阅读，右侧固定授权面板。
   颜色只从下面的变量取；风险（高/中/低）与决策（执行/关闭/暂缓/退回/未决策）各有一套语义色，和强调色分开。 */
:root{
  --bg:#f3f5f4;--surface:#ffffff;--surface-2:#f7f9f8;--sunken:#eaefed;
  --line:#dce2e0;--line-soft:#e9eeec;
  --ink:#17201e;--ink-2:#46514e;--ink-3:#77827f;
  --accent:#0e7c74;--accent-soft:#e1f1ee;--accent-ink:#0a5b55;--on-accent:#ffffff;
  --high:#c8372d;--high-soft:#fcebe9;--mid:#a8650b;--mid-soft:#fbf0dc;--low:#5d756d;--low-soft:#e7efec;
  --rework:#6a4fc0;--rework-soft:#efebfa;--defer:#4a6496;--defer-soft:#e7ecf6;--closed:#86908d;--closed-soft:#edf0ef;
  --shadow:0 1px 2px rgba(23,32,30,.04),0 8px 24px rgba(23,32,30,.035);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --d2h-bg-color:var(--surface);--d2h-border-color:var(--line);--d2h-dim-color:var(--ink-3);--d2h-line-border-color:var(--line-soft);
  --d2h-file-header-bg-color:var(--surface-2);--d2h-file-header-border-color:var(--line);
  --d2h-empty-placeholder-bg-color:var(--surface-2);--d2h-empty-placeholder-border-color:var(--line-soft);
  --d2h-ins-bg-color:#e8f6ed;--d2h-ins-border-color:#bfe3c9;--d2h-ins-highlight-bg-color:#b4e5c1;--d2h-ins-label-color:#2f8a4c;
  --d2h-del-bg-color:#fdeceb;--d2h-del-border-color:#f2c4c0;--d2h-del-highlight-bg-color:#f6c2bd;--d2h-del-label-color:#c8372d;
  --d2h-change-del-color:#fbf1dc;--d2h-change-ins-color:#e2f3e7;--d2h-info-bg-color:var(--surface-2);--d2h-info-border-color:var(--line-soft);
  --hl-text:var(--ink);--hl-kw:#cf222e;--hl-title:#8250df;--hl-attr:#0550ae;--hl-str:#0a3069;--hl-builtin:#953800;--hl-comment:#6e7781;--hl-name:#116329;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1312;--surface:#151c1a;--surface-2:#1a2220;--sunken:#222b29;
  --line:#2b3532;--line-soft:#222b28;
  --ink:#e3eae7;--ink-2:#aeb9b5;--ink-3:#7f8b87;
  --accent:#3db5a6;--accent-soft:rgba(61,181,166,.15);--accent-ink:#86d8cc;--on-accent:#06201d;
  --high:#f06a5e;--high-soft:rgba(240,106,94,.15);--mid:#e2a54a;--mid-soft:rgba(226,165,74,.15);--low:#93b3a8;--low-soft:rgba(147,179,168,.13);
  --rework:#a891f2;--rework-soft:rgba(168,145,242,.16);--defer:#94aad6;--defer-soft:rgba(148,170,214,.15);--closed:#7f8b87;--closed-soft:rgba(127,139,135,.16);
  --shadow:none;
  --d2h-ins-bg-color:rgba(46,160,67,.15);--d2h-ins-border-color:rgba(46,160,67,.4);--d2h-ins-highlight-bg-color:rgba(46,160,67,.4);--d2h-ins-label-color:#3fb950;
  --d2h-del-bg-color:rgba(248,81,73,.1);--d2h-del-border-color:rgba(248,81,73,.4);--d2h-del-highlight-bg-color:rgba(248,81,73,.4);--d2h-del-label-color:#f85149;
  --d2h-change-del-color:rgba(210,153,34,.2);--d2h-change-ins-color:rgba(46,160,67,.25);
  --hl-kw:#ff7b72;--hl-title:#d2a8ff;--hl-attr:#79c0ff;--hl-str:#a5d6ff;--hl-builtin:#ffa657;--hl-comment:#8b949e;--hl-name:#7ee787;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1312;--surface:#151c1a;--surface-2:#1a2220;--sunken:#222b29;
  --line:#2b3532;--line-soft:#222b28;
  --ink:#e3eae7;--ink-2:#aeb9b5;--ink-3:#7f8b87;
  --accent:#3db5a6;--accent-soft:rgba(61,181,166,.15);--accent-ink:#86d8cc;--on-accent:#06201d;
  --high:#f06a5e;--high-soft:rgba(240,106,94,.15);--mid:#e2a54a;--mid-soft:rgba(226,165,74,.15);--low:#93b3a8;--low-soft:rgba(147,179,168,.13);
  --rework:#a891f2;--rework-soft:rgba(168,145,242,.16);--defer:#94aad6;--defer-soft:rgba(148,170,214,.15);--closed:#7f8b87;--closed-soft:rgba(127,139,135,.16);
  --shadow:none;
  --d2h-ins-bg-color:rgba(46,160,67,.15);--d2h-ins-border-color:rgba(46,160,67,.4);--d2h-ins-highlight-bg-color:rgba(46,160,67,.4);--d2h-ins-label-color:#3fb950;
  --d2h-del-bg-color:rgba(248,81,73,.1);--d2h-del-border-color:rgba(248,81,73,.4);--d2h-del-highlight-bg-color:rgba(248,81,73,.4);--d2h-del-label-color:#f85149;
  --d2h-change-del-color:rgba(210,153,34,.2);--d2h-change-ins-color:rgba(46,160,67,.25);
  --hl-kw:#ff7b72;--hl-title:#d2a8ff;--hl-attr:#79c0ff;--hl-str:#a5d6ff;--hl-builtin:#ffa657;--hl-comment:#8b949e;--hl-name:#7ee787;
  color-scheme:dark;
}

/* ---------- 基础 ---------- */
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:13px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
#root{max-width:1600px;margin:0 auto;padding:0 28px 56px}
.mono,code,pre{font-family:var(--font-mono)}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}.small{font-size:12px}.tiny{font-size:11px}.strong{font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:12px;align-items:center}
.wrap{overflow-wrap:anywhere;word-break:break-word}
.block-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.stack{display:flex;flex-direction:column;gap:11px}
.space-top{margin-top:12px}
.section-label{font-size:13px;font-weight:650;margin:0 0 10px}
.path{font:11px/1.5 var(--font-mono);color:var(--ink-3);overflow-wrap:anywhere}
.ant-typography{overflow-wrap:anywhere}
.ant-tag{margin-inline-end:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- 顶栏 ---------- */
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:56px;margin:0 -28px;padding:8px 28px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.3) blur(10px);-webkit-backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line)}
.brand{font:700 15px/1 var(--font-mono);letter-spacing:-.03em;color:var(--ink)}
.brand em{font-style:normal;color:var(--accent)}
.header-desc{font-size:12px;color:var(--ink-3);padding-left:14px;border-left:1px solid var(--line)}
.header-actions{display:flex;margin-left:auto;gap:8px;flex-wrap:wrap}

/* ---------- MR 身份 ---------- */
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding:26px 0 18px}
.intro h1{font-size:26px;line-height:1.25;letter-spacing:-.02em;font-weight:700;margin:6px 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.intro h1 .iid{font:500 21px var(--font-mono);color:var(--ink-3);margin-left:6px}
.intro-meta{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.branch{font:12px/20px var(--font-mono);padding:0 7px;border-radius:4px;background:var(--sunken);color:var(--ink-2);overflow-wrap:anywhere}
a{color:var(--accent-ink)}
.mr-link{text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}

/* ---------- 交接预览 + 问题构成 ---------- */
.summary{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.ledger-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.ledger-sentence{margin:8px 0 0;font-size:15px;line-height:1.75;color:var(--ink-2);max-width:64ch}
.ledger-sentence b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.ledger-sentence b.n-approve{color:var(--accent-ink)}
.ledger-sentence .warn{color:var(--mid);font-weight:600}
.ledger-sentence .ok{color:var(--accent-ink);font-weight:600}
.ledger-progress{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.ledger-progress .big{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ledger-progress .big small{font-size:15px;font-weight:500;color:var(--ink-3)}
.ledger-bar{display:flex;gap:3px;height:30px;margin:16px 0 12px}
.seg{display:flex;align-items:center;min-width:26px;padding:0 9px;border-radius:5px;font:600 12px/1 var(--font-mono);overflow:hidden;white-space:nowrap}
.ledger-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink-2)}
.ledger-legend .lg{display:inline-flex;align-items:center}
.ledger-legend .lg b{margin-left:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.ledger-legend .lg.zero{opacity:.45}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.seg-APPROVE{background:var(--accent);color:var(--on-accent)}
.seg-CLOSE{background:var(--closed-soft);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.seg-DEFER{background:var(--defer-soft);color:var(--defer)}
.seg-PROVIDE_INFO{background:var(--rework-soft);color:var(--rework)}
.seg-UNDECIDED{color:var(--mid);background:repeating-linear-gradient(135deg,var(--mid-soft) 0 5px,transparent 5px 10px);box-shadow:inset 0 0 0 1px var(--mid)}
.seg{border:0;cursor:pointer;transition:filter .15s}.seg:hover{filter:brightness(.94)}
.ledger-legend .lg{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.ledger-legend .lg:disabled{cursor:default}.ledger-legend .lg:not(:disabled):hover{color:var(--ink)}
.mix-pick{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}.mix-pick:hover{color:var(--ink);text-decoration:underline}
.queue-card{scroll-margin-top:72px}
.seg{position:relative;transition:filter .15s,transform .15s,box-shadow .15s}
.seg:hover{filter:none;transform:translateY(-2px);box-shadow:0 3px 0 -1px var(--ink-3),0 6px 14px rgba(0,0,0,.18)}
.seg:active{transform:translateY(0)}
.seg:focus-visible,.ledger-legend .lg:focus-visible,.mix-pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ledger-legend .lg:not(:disabled):hover{text-decoration:underline;text-underline-offset:3px}
.hint-pill{display:inline-block;margin-left:10px;padding:2px 8px;border-radius:999px;background:var(--accent-soft,rgba(14,124,116,.12));color:var(--accent-ink);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none}
.kbd-hint{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);white-space:nowrap}
.kbd-hint kbd{display:inline-block;min-width:20px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--surface);color:var(--ink-2);font:600 11px/1.4 var(--font-mono);text-align:center}
@media (max-width:760px),(pointer:coarse){.kbd-hint{display:none}.hint-pill{display:none}}
.ledger-alert{margin-top:12px;padding:8px 11px;border-radius:6px;background:var(--high-soft);color:var(--high);font-size:12px;font-weight:600}
.facts{display:flex;flex-direction:column;gap:18px}
.mix{display:grid;grid-template-columns:auto minmax(0,1fr) 2.2em;gap:8px 12px;align-items:center;font-size:12px;color:var(--ink-2)}
.mix .bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.mix .bar i{display:block;height:100%;border-radius:3px}
.mix .n{font:600 12px var(--font-mono);color:var(--ink);text-align:right}
.fill-high{background:var(--high)}.fill-medium{background:var(--mid)}.fill-low{background:var(--low)}
.assess{margin-top:10px;font-size:12px;color:var(--ink-3)}
.assess b{color:var(--ink-2);font-variant-numeric:tabular-nums}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:22px;padding:0 9px 0 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:default}
.check::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.check.success::before{background:var(--accent)}
.check.error{color:var(--high);background:var(--high-soft);border-color:transparent}
.check.error::before{background:var(--high)}
.check.warning{color:var(--mid);background:var(--mid-soft);border-color:transparent}
.check.warning::before{background:var(--mid)}

/* ---------- 问题队列 ---------- */
.queue-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.queue-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.queue-title{font-size:15px;font-weight:700}
.count{font:600 12px/20px var(--font-mono);padding:0 7px;border-radius:4px;background:var(--sunken);color:var(--ink-2)}
.finding-table .ant-table{background:transparent;font-size:13px}
.finding-table .ant-table-container{border-radius:0!important}
.finding-table .ant-table-thead>tr>th{background:var(--surface-2)!important;color:var(--ink-3)!important;font-size:11px;font-weight:600!important;letter-spacing:.04em;padding:8px 12px!important;border-bottom:1px solid var(--line)!important;border-radius:0!important}
.finding-table .ant-table-thead>tr>th::before{display:none}
.finding-table .ant-table-tbody>tr.ant-table-row>td{padding:11px 12px!important;border-bottom:1px solid var(--line-soft)!important;vertical-align:middle;background:var(--surface)}
.finding-table .ant-table-row{cursor:pointer}
.finding-table .ant-table-tbody>tr.ant-table-row:hover>td{background:var(--surface-2)!important}
.finding-table .ant-table-tbody>tr.row-selected>td{background:var(--accent-soft)!important}
.finding-table .ant-table-tbody>tr.ant-table-row>td:first-child{box-shadow:inset 3px 0 0 transparent}
.finding-table .ant-table-tbody>tr.risk-high>td:first-child{box-shadow:inset 3px 0 0 var(--high)}
.finding-table .ant-table-tbody>tr.risk-medium>td:first-child{box-shadow:inset 3px 0 0 var(--mid)}
.finding-table .ant-table-tbody>tr.risk-low>td:first-child{box-shadow:inset 3px 0 0 var(--line)}
.finding-table .ant-pagination{padding:0 16px}
.id-cell{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.id-cell .id{font:12px var(--font-mono);color:var(--ink-3)}
.risk{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.risk-high{background:var(--high-soft);color:var(--high)}
.risk-medium{background:var(--mid-soft);color:var(--mid)}
.risk-low{background:var(--low-soft);color:var(--low)}
.q-cell{min-width:0}
.cell-title{display:block;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell-title .kind{font-weight:500;color:var(--ink-3);margin-right:8px;font-size:12px}
.q-cell .path{margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.rec::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.rec-FIX{color:var(--accent-ink)}.rec-DISMISS{color:var(--closed)}.rec-DEFER{color:var(--defer)}.rec-NEEDS_EVIDENCE{color:var(--mid)}
.acc{font-size:12px;white-space:nowrap}
.acc-human{color:var(--mid);font-weight:600}.acc-auto{color:var(--ink-2)}.acc-none{color:var(--ink-3)}
.ant-tag.dtag{margin:0;border-radius:4px;font-size:12px;font-weight:600;line-height:20px;padding:0 8px;border:1px solid transparent}
.ant-tag.dtag.is-ai{border-style:dashed}
.ant-tag.dtag-APPROVE{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ant-tag.dtag-APPROVE.is-ai{background:var(--accent-soft);color:var(--accent-ink)}
.ant-tag.dtag-CLOSE{background:var(--closed-soft);color:var(--ink-2);border-color:var(--line)}
.ant-tag.dtag-CLOSE.is-ai{border-color:var(--closed)}
.ant-tag.dtag-DEFER{background:var(--defer-soft);color:var(--defer)}
.ant-tag.dtag-PROVIDE_INFO{background:var(--rework-soft);color:var(--rework)}
.ant-tag.dtag-UNDECIDED{background:var(--mid-soft);color:var(--mid)}
.ant-tag.dtag-BAD{background:var(--high-soft);color:var(--high);border-color:var(--high)}
.op{display:flex;gap:2px;flex-wrap:nowrap}
.op .ant-btn{padding-inline:6px}
.ant-btn.btn-undo{color:var(--ink-3)}
.queue-closed{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.queue-closed-label{padding:11px 16px;font-size:12px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line-soft)}
.queue-closed .ant-table-tbody>tr>td{color:var(--ink-2)}

/* ---------- 详情工作单 ---------- */
.detail-modal .ant-modal{top:0;max-width:100vw;margin:0;padding-bottom:0}
.detail-modal .ant-modal-content{height:100vh;border-radius:0!important;display:flex;flex-direction:column;box-shadow:none;padding:0!important;background:var(--bg)!important}
.detail-modal .ant-modal-header{display:none}
.detail-modal .ant-modal-body{flex:1;overflow:auto;padding:0!important}
.detail-topbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 28px;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-sep{width:1px;height:18px;background:var(--line)}
.detail-shell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;max-width:1480px;margin:0 auto;padding:22px 28px 72px}
.detail-main{min-width:0;display:flex;flex-direction:column;gap:14px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.zone-title,.detail-rail-title{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-3)}
.zone-title .idx,.detail-rail-title .idx{font:600 11px/18px var(--font-mono);color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 6px}
.finding-title{font-size:20px;font-weight:700;line-height:1.45;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance;overflow-wrap:anywhere}
.finding-title code,.note-md code{font-size:.88em;background:var(--sunken);padding:1px 5px;border-radius:4px}
.lead{font-size:15px;font-weight:600;line-height:1.65;color:var(--ink)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-box{padding:12px 14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line-soft);min-width:0}
.info-box:last-child:nth-child(odd){grid-column:1/-1}
.label{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--ink-3);margin-bottom:6px}
.diff-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}

  .queue-toolbar .row{width:100%}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<script type="application/json" id="review-data">__REVIEW_JSON__</script>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/dayjs@1.11.13/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@5.27.4/dist/antd.min.js"></script>
<script src="https://unpkg.com/diff2html@3.4.56/bundles/js/diff2html-ui-slim.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.27.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
(() => {
'use strict';
const { useState,useEffect,useMemo,useRef }=React;
const { ConfigProvider,Card,Button,Input,Select,Tag,Progress,Alert,Modal,Radio,Empty,Space,Tooltip,Typography,message,Popconfirm,Divider,Table,Tabs,Switch,Collapse }=antd;
const { TextArea }=Input;
const review=JSON.parse(document.getElementById('review-data').textContent.trim());
if(review.schemaVersion!==1||!Array.isArray(review.findings)||!Array.isArray(review.closedFindings||[]))throw Error('Invalid review artifact');
const findings=review.findings,closed=review.closedFindings||[],ids=new Set(findings.map(f=>String(f.id)));
const storageKey=`ai-review:${review.reviewKey}`;
const PG_KEY='ai-review:page-size';const PG_OPTIONS=[10,20,30,50,100];
 const pgInit=(()=>{try{const v=Number(localStorage.getItem(PG_KEY));return PG_OPTIONS.includes(v)?v:30;}catch{return 30;}})();
 const pgSave=size=>{try{if(PG_OPTIONS.includes(Number(size)))localStorage.setItem(PG_KEY,String(size));}catch{}};
const list=v=>Array.isArray(v)?v:[];
const filled=v=>typeof v==='string'&&!!v.trim();
const executable=p=>!!(p&&filled(p.summary)&&filled(p.approach)&&Array.isArray(p.files)&&p.files.length&&Array.isArray(p.verification)&&p.verification.length&&['high','medium','low'].includes(p.fixRisk));
const canApprove=f=>f.analysis.recommendation==='FIX'&&executable(f.analysis.proposal);
const aiDefault=f=>f.analysis.recommendation==='FIX'&&canApprove(f)?'APPROVE':['DISMISS','DEFER'].includes(f.analysis.recommendation)?'CLOSE':null;
const aiReason=f=>{const a=f.analysis;return ((a.recommendation==='DEFER'?'AI建议暂缓处理：':a.recommendation==='DISMISS'?'AI建议驳回：':'AI建议关闭：')+(a.rootCause||a.impact||a.trigger||'详见分析').trim());};
const reviewDefault=f=>(f.analysis.proposal||{}).requiresHumanAcceptance!==false;
const reviewReason=f=>(f.analysis.proposal||{}).requiresHumanAcceptance===true?'方案明确保留人工验收义务，具体范围见验证要求':'旧方案未明确验收方式，需补评；不从风险或关键词推导';
const plain=v=>v==null||v===''?'未提供':String(v);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mdInline=t=>{let h=esc(t==null?'':t);h=h.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>'<img class="md-img" src="'+u+'" alt="'+a+'"/>');h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,x,u)=>'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+x+'</a>');h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');return h;};
const safeLink=url=>{try{const u=new URL(url);return /^https?:$/.test(u.protocol)?u.href:null;}catch{return null;}};
const riskText={high:'高风险',medium:'中风险',low:'低风险'};
const statusText={APPROVE:'批准',CLOSE:'关闭',DEFER:'暂缓',PROVIDE_INFO:'退回重评',UNDECIDED:'未处理'};
const assessmentText={CONFIRMED:'问题确认',DISMISSED:'问题驳回',NEEDS_EVIDENCE:'待补证据'};
const recommendationText={FIX:'建议修复',DISMISS:'建议驳回',DEFER:'建议暂缓',NEEDS_EVIDENCE:'待补证据'};
const evidenceText={OBSERVED:'已观察',DERIVED:'推导',INFERRED:'推测'};
const platformText={PENDING:'待处理',CLOSED_NOT_ADOPTED:'关闭·未采纳',IGNORED:'已忽略',CLOSED_WITH_ACTION:'已处理·动作未知',UNKNOWN:'未知'};
const riskColor=r=>r==='high'?'error':r==='medium'?'warning':'success';
const riskRank={high:0,medium:1,low:2};
const recColor={FIX:'blue',DISMISS:'default',DEFER:'orange',NEEDS_EVIDENCE:'gold'};
const VIEW_OPTIONS=[{value:'all',label:'全部'},{value:'high',label:'高风险'},{value:'medium',label:'中风险'},{value:'low',label:'低风险'},{value:'evidence',label:'待补证据'},{value:'review',label:'需人工验收'},{value:'abnormal',label:'授权异常'},{value:'undecided',label:'未决策'},{value:'d:APPROVE',label:'将执行修复'},{value:'d:CLOSE',label:'将关闭'},{value:'d:DEFER',label:'暂缓'},{value:'d:PROVIDE_INFO',label:'退回重评'}];
const oqNorm=q=>typeof q==='string'?{question:q,options:[]}:(q&&typeof q==='object'?{question:q.question||q.q||'',options:Array.isArray(q.options)?q.options:[]}:{question:'',options:[]});
const signalColor=v=>v===true?'success':v===false?'error':'default';
const signalText=(v,yes,no)=>v===true?yes:v===false?no:'未知';
const location=s=>`${s.path||'未知文件'}${s.lineRange?.fromLine?`:${s.lineRange.fromLine}${s.lineRange.toLine!==s.lineRange.fromLine?'-'+s.lineRange.toLine:''}`:s.line?':'+s.line:''}`;
const nameOf=f=>f.source.title||f.source.note?.split('\n').find(Boolean)?.slice(0,100)||`Finding #${f.id}`;
const fullTitle=f=>{const t=f.source.title||(f.analysis.rootCause||f.analysis.impact||f.analysis.trigger||nameOf(f));return String(t).replace(/\s+/g,' ').trim();};
const diffStat=f=>(f.source.diffContext||'').split('\n').reduce((c,l)=>{if(l.startsWith('+')&&!l.startsWith('+++'))c.add++;else if(l.startsWith('-')&&!l.startsWith('---'))c.del++;return c;},{add:0,del:0});
const countsBy=(arr,values)=>Object.fromEntries(values.map(v=>[v,arr.filter(x=>x===v).length]));
const noteBadge=f=>{const m=/!\[([^\]]+)\]\([^)]*\)/.exec(f.source.note||'');return m?m[1].trim():null;};
const shortTitle=f=>{if(f.source.title)return String(f.source.title);const line=(f.source.note||'').split('\n').map(s=>s.replace(/!\[[^\]]*\]\([^)]*\)/g,'').trim()).find(Boolean);return line?line.replace(/`/g,'').slice(0,160):nameOf(f);};
const fmtTime=v=>{if(!v||typeof dayjs==='undefined')return v||'';const d=dayjs(v);return d.isValid()?d.format('YYYY-MM-DD HH:mm'):String(v);};
const LIGHT_TOKENS={colorPrimary:'#0e7c74',colorBgLayout:'#f3f5f4',colorText:'#17201e',colorTextSecondary:'#46514e',colorError:'#c8372d',colorWarning:'#a8650b',colorSuccess:'#0e7c74',colorInfo:'#0e7c74',colorBorder:'#d3dad7',colorBorderSecondary:'#e6ebe9'};
const DARK_TOKENS={colorPrimary:'#3db5a6',colorBgLayout:'#0e1312',colorBgContainer:'#151c1a',colorBgElevated:'#1c2422',colorText:'#e3eae7',colorTextSecondary:'#aeb9b5',colorError:'#f06a5e',colorWarning:'#e2a54a',colorSuccess:'#3db5a6',colorInfo:'#3db5a6',colorBorder:'#34403c',colorBorderSecondary:'#26302d'};
const prefersDark=()=>{const t=document.documentElement.getAttribute('data-theme');if(t==='dark')return true;if(t==='light')return false;try{return window.matchMedia('(prefers-color-scheme: dark)').matches;}catch{return false;}};
function useDark(){const [dark,setDark]=useState(prefersDark);useEffect(()=>{let m;try{m=window.matchMedia('(prefers-color-scheme: dark)');}catch{return;}const h=()=>setDark(prefersDark());if(m.addEventListener)m.addEventListener('change',h);else m.addListener(h);return()=>{if(m.removeEventListener)m.removeEventListener('change',h);else m.removeListener(h);};},[]);return dark;}
const LEDGER=[['APPROVE','执行修复'],['CLOSE','关闭评论'],['DEFER','暂缓'],['PROVIDE_INFO','退回重评'],['UNDECIDED','未决策']];
function Ledger({counts,total,humanReview,stale,invalid,onPick}){
 const decided=total-(counts.UNDECIDED||0);
 return <section className="panel ledger" aria-label="交接预览">
  <div className="ledger-top">
   <div style={{minWidth:0}}><div className="eyebrow">交接预览 · 现在生成交接会发生什么<span className="hint-pill">点下方色块可筛选</span></div>
    <p className="ledger-sentence">{total?<>将执行 <b className="n-approve">{counts.APPROVE}</b> 条修复{counts.APPROVE>0&&<>（其中 <b>{humanReview}</b> 条执行后需人工验收）</>}，关闭 <b>{counts.CLOSE}</b> 条评论，退回重评 <b>{counts.PROVIDE_INFO}</b> 条{counts.DEFER>0&&<>，暂缓 <b>{counts.DEFER}</b> 条</>}。{counts.UNDECIDED>0?<span className="warn">还有 {counts.UNDECIDED} 条未决策，它们不会被执行。</span>:<span className="ok">全部已决策。</span>}</>:'没有需要决策的问题。'}</p></div>
   <div className="ledger-progress"><span className="big">{decided}<small>/{total}</small></span><span className="tiny muted">已决策（含 AI 默认）</span></div>
  </div>
  {total>0&&<div className="ledger-bar" role="group" aria-label="按交接结果筛选问题队列">{LEDGER.filter(([k])=>counts[k]>0).map(([k,l])=><button type="button" key={k} className={'seg seg-'+k} style={{flexGrow:counts[k]}} title={'只看「'+l+'」'+counts[k]+' 条'} onClick={()=>onPick&&onPick(k)}>{counts[k]}</button>)}</div>}
  <div className="ledger-legend">{LEDGER.map(([k,l])=><button type="button" key={k} className={'lg'+(counts[k]?'':' zero')} disabled={!counts[k]} onClick={()=>onPick&&onPick(k)}><i className={'sw seg-'+k}/>{l}<b>{counts[k]||0}</b></button>)}</div>
  {(stale>0||invalid>0)&&<div className="ledger-alert">{stale} 条授权已过期、{invalid} 条决策无效：交接时会写成「未决策」，请在详情里重新选择。</div>}
 </section>;
}

function normalizeDiff(raw,path){const diff=raw.replace(/\r\n?/g,'\n').trimEnd()+'\n';if(/^diff --git /m.test(diff)||/^--- /m.test(diff))return diff;if(!/^@@\s+-\d+/m.test(diff))return null;const p=String(path||'unknown-file').replace(/[\r\n]/g,'_');return `--- a/${p}\n+++ b/${p}\n${diff}`;}
function markLines(element,source){if(!source)return false;const from=Number.isFinite(source.lineRange?.fromLine)?source.lineRange.fromLine:source.line;const to=Number.isFinite(source.lineRange?.toLine)?source.lineRange.toLine:from;if(!Number.isFinite(from))return false;let found=false;for(const cell of element.querySelectorAll('.d2h-code-linenumber,.d2h-code-side-linenumber')){const tr=cell.closest('tr');if(!tr)continue;const ns=(cell.getAttribute('data-line-number')||cell.textContent||'').trim().split(/\s+/);if(!ns.some(n=>/^\d+$/.test(n)&&Number(n)>=from&&Number(n)<=to))continue;const className=tr.className+' '+cell.className;if(source.side==='old'&&/d2h-ins/.test(className))continue;if(source.side!=='old'&&/d2h-del/.test(className))continue;tr.classList.add('review-target');found=true;}return found;}
function DiffPane({title,subtitle,raw='',path,source,mode,onModeChange,proposed=false,empty}){
 const el=useRef(null);
 const changes=useMemo(()=>raw.split('\n').reduce((c,line)=>{if(line.startsWith('+')&&!line.startsWith('+++'))c.add++;else if(line.startsWith('-')&&!line.startsWith('---'))c.del++;return c;},{add:0,del:0}),[raw]);
 useEffect(()=>{if(!el.current||!raw.trim())return;const target=el.current;target.replaceChildren();const normalized=normalizeDiff(raw,path);if(normalized){const ui=new Diff2HtmlUI(target,normalized,{drawFileList:false,matching:'lines',highlight:true,outputFormat:mode==='split'?'side-by-side':'line-by-line',fileContentToggle:false,synchronisedScroll:true});ui.draw();ui.highlightCode();markLines(target,source);}else{target.textContent=raw;target.style.whiteSpace='pre';}return()=>{target.replaceChildren();target.style.whiteSpace='';};},[raw,path,mode,source]);
 return <div className={'diff-card'+(proposed?' proposed':'')}>
  <div className="diff-head"><div><div className="section-label" style={{margin:0}}>{title}</div><div className="diff-desc">{subtitle}</div></div>
   {raw.trim()&&<Space size={6} wrap><Tag color="success">+{changes.add}</Tag><Tag color="error">-{changes.del}</Tag>{onModeChange&&<Radio.Group size="small" optionType="button" buttonStyle="solid" value={mode} onChange={e=>onModeChange(e.target.value)} options={[{label:'并排',value:'split'},{label:'行内',value:'unified'}]}/>}</Space>}</div>
  {raw.trim()?<div className="diff-canvas" tabIndex={0} ref={el}/>:<div className="no-diff"><Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description={empty}/></div>}
 </div>;
}
function DecisionZone({f,decision,state,onChoose,onNote,onAnswer,onNext,onWarn}){
 const aiSuggest=aiDefault(f);
 const scenario=canApprove(f)?'fix':(f.analysis.assessment==='NEEDS_EVIDENCE'||f.analysis.recommendation==='NEEDS_EVIDENCE')?'info':'close';
 const note=(decision&&decision.note)||'';
 const answers=(decision&&decision.answers)||{};
 const hasInput=!!note.trim()||Object.values(answers).some(v=>v&&String(v).trim());
 const label=scenario==='info'?'补充说明 / 纠正 Agent 判断（主要输入）':scenario==='fix'?'补充执行要求 / 纠正方案（可选）':'异议 / 补充事实（可选）';
 const ph=scenario==='info'?'例：后端实际架构是…，因此上述疑问不成立。可一句话纠正 Agent 的整体判断，不必逐条回答。':scenario==='fix'?'对修复方案的修改意见、额外执行要求或不同意见…':'若不认可关闭依据，说明理由与事实…';
 const doClose=()=>{if(!note.trim()){onWarn('关闭必须填写理由（可直接使用上方补充说明）');return;}onChoose('CLOSE');};
 const doInfo=()=>{if(!hasInput){onWarn('请先填写补充说明，或回答至少一个待确认问题');return;}onChoose('PROVIDE_INFO');};
 return <div className="decision decision-inline">
  <div className="between"><div className="eyebrow">你的决策</div><Tag color={state.kind==='valid'?'success':state.kind==='stale'||state.kind==='invalid'?'error':'default'}>{state.kind==='stale'?'授权过期':state.kind==='invalid'?'决策无效':state.kind==='valid'?(state.isDefault?'有效授权 · AI默认':'有效授权'):'未授权'}</Tag></div>
  <div className="label space-top">{label}</div>
  <TextArea rows={3} placeholder={ph} value={note} onChange={e=>onNote(e.target.value)}/>
  {scenario==='info'&&list(f.analysis.openQuestions).length>0&&<Collapse ghost size="small" className="space-top" items={[{key:'q',label:`Agent 待确认问题（${list(f.analysis.openQuestions).length}）· 可选展开回答`,children:<div>{list(f.analysis.openQuestions).map((raw,i)=>{const q=oqNorm(raw);const cur=answers[i]||'';return <div className="oq" key={i}><div className="block-text">{q.question}</div>{q.options.length>0&&<div className="row space-top">{q.options.map((op,oi)=><Button key={oi} size="small" type={cur===op?'primary':'default'} onClick={()=>onAnswer(i,op)}>{String.fromCharCode(65+oi)}. {op}</Button>)}</div>}<Input size="small" className="space-top" placeholder="自定义回答（可选）" value={cur} onChange={e=>onAnswer(i,e.target.value)}/></div>;})}</div>}]} />}
  {scenario==='fix'&&<div className={'accept-banner '+(reviewDefault(f)?'on':'off')}><span>{reviewDefault(f)?'⚠ 执行后需人工验收 / 补评':'✓ 按方案自动验证'}</span><span className="tiny" style={{fontWeight:500}}>{reviewDefault(f)?('验收依据：'+reviewReason(f)):'仍须证明实际覆盖，不代表验证已完成'}</span></div>}
  <div className="decision-actions">

 ];

      <div className="row muted small wrap" style={{gap:8}}><span className="mono">{review.repo}</span><span>·</span><span>MR !{review.iid??review.mergeRequestId}</span>{selectedActive&&selectedActive.analysis.proposal&&selectedActive.analysis.proposal.owner&&<><span>·</span><span>{selectedActive.analysis.proposal.owner}</span></>}<span>·</span><span className="path mono">{location(selected.source)}</span></div>
      <div className="detail-grid space-top">
       <div className="info-box"><div className="label">已发生的变更（事实）</div><div className="block-text">修改 <span className="path mono">{selected.source.path}</span>（+{diffStat(selected).add} / -{diffStat(selected).del}）。下方为与当前 Finding 直接相关的关键 Diff，默认可见。</div></div>
       <div className="info-box"><div className="label">Review 提出的潜在风险（{selectedActive?assessmentText[selectedActive.analysis.assessment]:'平台已关闭'}）</div><div className="block-text">{plain(selectedActive?selectedActive.analysis.trigger:selected.source.note)}</div></div>
      </div>
      <div className="space-top"><DiffPane key={'o:'+selectedId} title="关键代码变更" subtitle={selected.source.path} raw={selected.source.diffContext||''} path={selected.source.path} source={selected.source} mode={diffView} onModeChange={setDiffView} empty="尚未提供原始 Diff"/></div>
      <Collapse ghost size="small" className="space-top" items={[{key:'raw',label:'完整原始材料（Review 原文 / 云端建议 / 代码上下文）',children:<div>
       <div className="label">原始 Review · {selected.source.author||'匿名'}</div>
       <div className="note-md block-text" dangerouslySetInnerHTML={{__html:mdInline(selected.source.note||'')}}/>
       {selected.source.suggestion&&<><div className="label space-top">云端建议（未应用）</div><pre className="code-plain" style={{whiteSpace:'pre-wrap',maxHeight:'none'}}>{selected.source.suggestion}</pre></>}
       {selected.source.context&&!selected.source.diffContext&&<><div className="label space-top">代码上下文</div><pre className="code-plain" style={{whiteSpace:'pre-wrap',maxHeight:'none'}}>{selected.source.context}</pre></>}
       <div className="row muted tiny space-top">{selected.source.createdAt&&<span>创建 {selected.source.createdAt}</span>}{selected.source.updatedAt&&<span> · 更新 {selected.source.updatedAt}</span>}{selected.source.platformState&&<span> · 平台：{platformText[selected.source.platformInterpretation]||selected.source.platformInterpretation||'未知'}</span>}</div>
      </div>}]} />
     </div>
     {selectedActive&&<>
      <div className="zone"><div className="zone-title"><span className="idx">02</span>Agent 分析与处理建议</div>
       <div className="row" style={{gap:10}}><span className={'rec rec-'+selectedActive.analysis.recommendation}>{recommendationText[selectedActive.analysis.recommendation]||selectedActive.analysis.recommendation}</span><span className="muted small">{assessmentText[selectedActive.analysis.assessment]||selectedActive.analysis.assessment}</span></div>
       {selectedActive.analysis.assessment!=='NEEDS_EVIDENCE'&&<div className="block-text space-top lead">{plain(selectedActive.analysis.rootCause||selectedActive.analysis.proposal&&selectedActive.analysis.proposal.summary)}</div>}
       {selectedActive.analysis.assessment==='NEEDS_EVIDENCE'&&<div className="kb space-top"><div className="kb-title">调查已达仓库知识边界 · 需外部事实</div><div className="detail-grid"><div><div className="label">当前可确定</div><div className="block-text">{plain(selectedActive.analysis.rootCause||selectedActive.analysis.trigger)}</div></div><div><div className="label">缺少的外部信息</div><ul className="plain-list">{list(selectedActive.analysis.openQuestions).map((q,i)=><li key={i}>{oqNorm(q).question}</li>)}{!list(selectedActive.analysis.openQuestions).length&&<li className="muted">未列明</li>}</ul></div><div><div className="label">为何影响判断</div><div className="block-text">{plain(selectedActive.analysis.impact)}</div></div><div><div className="label">需要人工提供</div><div className="block-text">后端实现 / 外部接口行为 / 产品意图等仓库外事实；在 03 区一句话补充即可，Agent 将据此重新评估整个 Finding，而非机械填表。</div></div></div></div>}
       {selectedActive.analysis.proposal&&<div className="proposal space-top"><div className="between"><span className="eyebrow">建议方案</span><span className={'risk risk-'+selectedActive.analysis.proposal.fixRisk}>修复风险 · {riskText[selectedActive.analysis.proposal.fixRisk]||selectedActive.analysis.proposal.fixRisk}</span></div><div className="proposal-title">{selectedActive.analysis.proposal.summary}</div><div className="block-text">{selectedActive.analysis.proposal.approach}</div><div className="label space-top">涉及文件</div><div className="row">{list(selectedActive.analysis.proposal.files).map((fp,i)=><Tag key={i}>{fp}</Tag>)}</div><div className="detail-grid space-top"><div><div className="label">预期变更</div><ul className="plain-list">{list(selectedActive.analysis.proposal.changes).map((c,i)=><li key={i}>{c}</li>)}{!list(selectedActive.analysis.proposal.changes).length&&<li className="muted">未提供</li>}</ul></div><div><div className="label">验证要求</div><ul className="plain-list">{list(selectedActive.analysis.proposal.verification).map((v,i)=><li key={i}>{v}</li>)}</ul></div></div></div>}
       <div className="label space-top">证据 · {list(selectedActive.analysis.evidence).length}</div>{list(selectedActive.analysis.evidence).map((ev,i)=><div className="evidence" key={i}><div className="row"><Tag>{evidenceText[ev.kind]||ev.kind}</Tag><span className="path mono">{ev.ref}</span></div><div className="block-text space-top">{ev.summary}</div></div>)}{!list(selectedActive.analysis.evidence).length&&<span className="muted small">无证据记录</span>}
      </div>
     </>}
    </div>
    <aside className="decision-rail">
     {selectedActive?<>
      <div className="detail-rail-title"><span className="idx">03</span>人工决策</div>
       <DecisionZone f={selectedActive} decision={selectedDecision} state={selectedState} onChoose={chooseDecision} onNote={updateNote} onAnswer={setAnswer} onNext={nextUndecided} onWarn={m=>message.warning(m)}/>
     </>:<Alert type="info" showIcon message="平台已关闭 · 无需决策。只读展示，不进入 LocalStorage 授权或交接。"/>}
    </aside>
    </div></div>}
  </Modal>
 </main>
 <Modal rootClassName="reason-modal" afterOpenChange={o=>{if(o)setTimeout(()=>reasonRef.current&&reasonRef.current.focus(),0);}} open={!!closeTarget} title={closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'退回重评 · 填写理由':'关闭评论 · 填写理由'} width={520} okText={closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'提交':'确认关闭'} cancelText="取消" onCancel={()=>{setCloseTarget(null);setCloseReason('');}} onOk={()=>{if(!closeReason.trim()){message.warning(closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'退回重评必须填写理由':'关闭必须填写理由');return;}decideFor(closeTarget.id,closeTarget.mode,closeReason.trim());setCloseTarget(null);setCloseReason('');}}><TextArea ref={reasonRef} onKeyDown={e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();const b=document.querySelector('.reason-modal .ant-modal-footer .ant-btn-primary');if(b)b.click();}}} rows={3} value={closeReason} onChange={e=>setCloseReason(e.target.value)} placeholder={closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'为什么退回重评：agent 误读上下文 / 触发条件不可达 / 结论与事实不符…（理由将交给 Agent 重新评估整条 Finding）':'为什么关闭：误报 / 已在他处解决 / 本 MR 不处理（另单跟）…'}/><div className="tiny muted" style={{marginTop:6}}>⌘ / Ctrl + Enter 提交</div></Modal>
 <Modal open={handoffOpen} title="Decision Envelope" onCancel={()=>setHandoffOpen(false)} width={760} footer={<Space><Button onClick={()=>setHandoffOpen(false)}>关闭</Button><Button type="primary" onClick={copyEnvelope}>复制 JSON</Button></Space>}>
  <p className="small muted">每个 active finding 生成一条决策；stale / invalid 写为 UNDECIDED，closed 不进入交接。</p>{envelopeCounts.UNDECIDED>0&&<Alert type="warning" showIcon message={'有 '+envelopeCounts.UNDECIDED+' 条未决策（含授权过期、决策无效），交接后 Agent 不会处理它们。'}/>}<div className="envelope-counts"><Tag className="dtag dtag-APPROVE">修复 {envelopeCounts.APPROVE}</Tag><Tag className="dtag dtag-CLOSE">关闭 {envelopeCounts.CLOSE}</Tag><Tag className="dtag dtag-DEFER">暂缓 {envelopeCounts.DEFER}</Tag><Tag className="dtag dtag-PROVIDE_INFO">重评 {envelopeCounts.PROVIDE_INFO}</Tag><Tag className="dtag dtag-UNDECIDED">未决策 {envelopeCounts.UNDECIDED}</Tag></div><TextArea className="handoff-text" readOnly rows={16} value={envelopeText}/>
 </Modal>
 </ConfigProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script>
</body>
</html>
