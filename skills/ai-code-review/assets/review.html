<script type="text/babel" data-presets="react">
(() => {

if(review.schemaVersion!==1||!Array.isArray(review.findings)||!Array.isArray(review.closedFindings||[]))throw Error('Invalid review artifact');
const findings=review.findings,closed=review.closedFindings||[],ids=new Set(findings.map(f=>String(f.id)));
const storageKey=`ai-review:${review.reviewKey}`;
const PG_KEY='ai-review:page-size';const PG_OPTIONS=[10,20,30,50,100];
 const pgInit=(()=>{try{const v=Number(localStorage.getItem(PG_KEY));return PG_OPTIONS.includes(v)?v:30;}catch{return 30;}})();
 const pgSave=size=>{try{if(PG_OPTIONS.includes(Number(size)))localStorage.setItem(PG_KEY,String(size));}catch{}};

const aiReason=f=>{const a=f.analysis;return ((a.recommendation==='DEFER'?'AI建议暂缓处理：':a.recommendation==='DISMISS'?'AI建议驳回：':'AI建议关闭：')+(a.rootCause||a.impact||a.trigger||'详见分析').trim());};

const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mdInline=t=>{let h=esc(t==null?'':t);h=h.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g,(m,a,u)=>'<img class="md-img" src="'+u+'" alt="'+a+'"/>');h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,x,u)=>'<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+x+'</a>');h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');return h;};
const safeLink=url=>{try{const u=new URL(url);return /^https?:$/.test(u.protocol)?u.href:null;}catch{return null;}};
const riskText={high:'高风险',medium:'中风险',low:'低风险'};

const VIEW_OPTIONS=[{value:'all',label:'全部'},{value:'high',label:'高风险'},{value:'evidence',label:'待补证据'},{value:'review',label:'需人工验收'},{value:'abnormal',label:'授权异常'},{value:'undecided',label:'未决策'}];
const oqNorm=q=>typeof q==='string'?{question:q,options:[]}:(q&&typeof q==='object'?{question:q.question||q.q||'',options:Array.isArray(q.options)?q.options:[]}:{question:'',options:[]});

const signalText=(v,yes,no)=>v===true?yes:v===false?no:'未知';

const nameOf=f=>f.source.title||f.source.note?.split('\n').find(Boolean)?.slice(0,100)||`Finding #${f.id}`;
const fullTitle=f=>{const t=f.source.title||(f.analysis.rootCause||f.analysis.impact||f.analysis.trigger||nameOf(f));return String(t).replace(/\s+/g,' ').trim();};
const diffStat=f=>(f.source.diffContext||'').split('\n').reduce((c,l)=>{if(l.startsWith('+')&&!l.startsWith('+++'))c.add++;else if(l.startsWith('-')&&!l.startsWith('---'))c.del++;return c;},{add:0,del:0});

function normalizeDiff(raw,path){const diff=raw.replace(/\r\n?/g,'\n').trimEnd()+'\n';if(/^diff --git /m.test(diff)||/^--- /m.test(diff))return diff;if(!/^@@\s+-\d+/m.test(diff))return null;const p=String(path||'unknown-file').replace(/[\r\n]/g,'_');return `--- a/${p}\n+++ b/${p}\n${diff}`;}
function markLines(element,source){if(!source)return false;const from=Number.isFinite(source.lineRange?.fromLine)?source.lineRange.fromLine:source.line;const to=Number.isFinite(source.lineRange?.toLine)?source.lineRange.toLine:from;if(!Number.isFinite(from))return false;let found=false;for(const cell of element.querySelectorAll('.d2h-code-linenumber,.d2h-code-side-linenumber')){const tr=cell.closest('tr');if(!tr)continue;const ns=(cell.getAttribute('data-line-number')||cell.textContent||'').trim().split(/\s+/);if(!ns.some(n=>/^\d+$/.test(n)&&Number(n)>=from&&Number(n)<=to))continue;const className=tr.className+' '+cell.className;if(source.side==='old'&&/d2h-ins/.test(className))continue;if(source.side!=='old'&&/d2h-del/.test(className))continue;tr.classList.add('review-target');found=true;}return found;}

 const el=useRef(null);

 useEffect(()=>{if(!el.current||!raw.trim())return;const target=el.current;target.replaceChildren();const normalized=normalizeDiff(raw,path);if(normalized){const ui=new Diff2HtmlUI(target,normalized,{drawFileList:false,matching:'lines',highlight:true,outputFormat:mode==='split'?'side-by-side':'line-by-line',fileContentToggle:false,synchronisedScroll:true});ui.draw();ui.highlightCode();markLines(target,source);}else{target.textContent=raw;target.style.whiteSpace='pre';}return()=>{target.replaceChildren();target.style.whiteSpace='';};},[raw,path,mode,source]);

  <Card className="queue-card"><div className="between" style={{padding:'2px 2px 11px'}}><div className="row"><strong style={{fontSize:14}}>问题队列</strong><Tag>{filtered.length} / {findings.length}</Tag></div>
   <div className="row" style={{gap:7,justifyContent:'flex-end'}}><Input.Search allowClear placeholder="搜索问题、文件或 ID…" value={filters.q} onChange={e=>updateFilter('q',e.target.value)} style={{width:210}} size="small"/><Select size="small" value={filters.view} onChange={v=>updateFilter('view',v)} style={{width:132}} options={VIEW_OPTIONS}/></div>
  </div><FindingTable rows={ordered} onOpen={openDetail} selectedId={selectedId} stateOf={decisionState} onApprove={id=>decideFor(id,'APPROVE')} onRevert={id=>decideFor(id,'UNDECIDED')} onClose={id=>setCloseTarget({id,mode:'CLOSE'})} onReject={id=>setCloseTarget({id,mode:'PROVIDE_INFO'})}/>{!filtered.length&&<Empty image={Empty.PRESENTED_IMAGE_SIMPLE} description="没有符合条件的问题"/>}</Card>
  {!!closed.length&&<div className="queue-closed"><div className="between queue-closed-label"><span>已关闭 · 无需决策</span><span>{closed.length}</span></div><Table className="finding-table" size="small" rowKey="id" pagination={{size:'small',defaultPageSize:5,hideOnSinglePage:true}} dataSource={closed} scroll={{x:620}} onRow={f=>({onClick:()=>openDetail(f.id)})} rowClassName={f=>String(f.id)===selectedId?'row-selected':''} columns={[{title:'ID',dataIndex:'id',width:70,render:v=><span className="mono muted">#{v}</span>},{title:'平台',width:150,render:(_,f)=><Tag>{platformText[f.source.platformInterpretation]||'已关闭'}</Tag>},{title:'位置',width:260,responsive:['lg'],render:(_,f)=><span className="path mono">{location(f.source)}</span>},{title:'问题',ellipsis:true,render:(_,f)=><span className="cell-title">{nameOf(f)}</span>}]} /></div>}
  <Modal className="detail-modal" open={detailOpen&&!!selected} onCancel={()=>setDetailOpen(false)} width="100vw" style={{maxWidth:'100vw',top:0,padding:0}} footer={null} destroyOnClose closable={false}>
   {selected&&<div><div className="detail-topbar"><div style={{minWidth:0}}><div className="eyebrow">{selectedClosed?'CLOSED · READ ONLY':'ACTIVE FINDING'} / #{selected.id}</div></div><div className="row" style={{marginLeft:'auto'}}>{selectedActive&&<><Tag color={riskColor(selectedActive.analysis.issueRisk)}>{riskText[selectedActive.analysis.issueRisk]}</Tag><Tag color={recColor[selectedActive.analysis.recommendation]||'default'}>{recommendationText[selectedActive.analysis.recommendation]||selectedActive.analysis.recommendation}</Tag>{canApprove(selectedActive)&&<Tag color={reviewDefault(selectedActive)?'error':'success'}>{reviewDefault(selectedActive)?'执行后需人工验收':'AI 自验即可'}</Tag>}</>}{selectedActive&&<><Button size="small" type="text" disabled={ordered.findIndex(f=>String(f.id)===selectedId)<=0} onClick={()=>gotoStep(-1)}>←</Button><span className="muted tiny mono" style={{minWidth:40,textAlign:'center'}}>{ordered.findIndex(f=>String(f.id)===selectedId)+1} / {ordered.length}</span><Button size="small" type="text" disabled={ordered.findIndex(f=>String(f.id)===selectedId)>=ordered.length-1} onClick={()=>gotoStep(1)}>→</Button><span style={{width:1,height:18,background:'#e3e9f1'}}/></>}{selectedClosed&&<span className="muted tiny" style={{marginRight:6}}>已关闭 · 只读</span>}<Button onClick={()=>setDetailOpen(false)}>收起队列</Button></div></div>
    <div className="detail-shell"><div className="detail-main">
     <div className="zone"><div className="zone-title"><span className="idx">01</span>问题与代码变更 · Context</div>
      <h2 className="finding-title" dangerouslySetInnerHTML={{__html:mdInline(fullTitle(selected))}}/>
      <div className="row muted small wrap" style={{gap:8}}><span className="mono">{review.repo}</span><span>·</span><span>MR !{review.iid??review.mergeRequestId}</span>{selectedActive&&selectedActive.analysis.proposal&&selectedActive.analysis.proposal.owner&&<><span>·</span><span>{selectedActive.analysis.proposal.owner}</span></>}<span>·</span><span className="path mono">{location(selected.source)}</span></div>
      <div className="detail-grid space-top">
       <div className="info-box"><div className="label">已发生的变更（事实）</div><div className="block-text">修改 <span className="path mono">{selected.source.path}</span>（+{diffStat(selected).add} / -{diffStat(selected).del}）。下方为与当前 Finding 直接相关的关键 Diff，默认可见。</div></div>
       <div className="info-box"><div className="label">Review 提出的潜在风险（{selectedActive?assessmentText[selectedActive.analysis.assessment]:'平台已关闭'}）</div><div className="block-text">{plain(selectedActive?selectedActive.analysis.trigger:selected.source.note)}</div></div>
      </div>
      <div className="space-top"><DiffPane key={'o:'+selectedId} title="关键代码变更" subtitle={selected.source.path} raw={selected.source.diffContext||''} path={selected.source.path} source={selected.source} mode={diffView} onModeChange={setDiffView} empty="尚未提供原始 Diff"/></div>
      <Collapse ghost size="small" className="space-top" items={[{key:'raw',label:'完整原始材料（Review 原文 / 云端建议 / 代码上下文）',children:<div>
       <div className="label">原始 Review · {selected.source.author||'匿名'}</div>
       <div className="note-md block-text" dangerouslySetInnerHTML={{__html:mdInline(selected.source.note||'')}}/>
       {selected.source.suggestion&&<><div className="label space-top">云端建议（未应用）</div><pre className="code-plain" style={{whiteSpace:'pre-wrap',maxHeight:'none'}}>{selected.source.suggestion}</pre></>}
       {selected.source.context&&!selected.source.diffContext&&<><div className="label space-top">代码上下文</div><pre className="code-plain" style={{whiteSpace:'pre-wrap',maxHeight:'none'}}>{selected.source.context}</pre></>}
       <div className="row muted tiny space-top">{selected.source.createdAt&&<span>创建 {selected.source.createdAt}</span>}{selected.source.updatedAt&&<span> · 更新 {selected.source.updatedAt}</span>}{selected.source.platformState&&<span> · 平台：{platformText[selected.source.platformInterpretation]||selected.source.platformInterpretation||'未知'}</span>}</div>
      </div>}]} />
     </div>
     {selectedActive&&<>
      <div className="zone"><div className="zone-title"><span className="idx">02</span>Agent 分析与处理建议 · Analysis</div>
       <div className="row" style={{gap:6}}><Tag color={recColor[selectedActive.analysis.recommendation]||'default'}>{recommendationText[selectedActive.analysis.recommendation]||selectedActive.analysis.recommendation}</Tag><Tag color={riskColor(selectedActive.analysis.issueRisk)}>{riskText[selectedActive.analysis.issueRisk]}</Tag></div>
       {selectedActive.analysis.assessment!=='NEEDS_EVIDENCE'&&<div className="block-text space-top" style={{fontSize:14,fontWeight:600}}>{plain(selectedActive.analysis.rootCause||selectedActive.analysis.proposal&&selectedActive.analysis.proposal.summary)}</div>}
       {selectedActive.analysis.assessment==='NEEDS_EVIDENCE'&&<div className="kb space-top"><div className="kb-title">调查已达仓库知识边界 · 需外部事实</div><div className="detail-grid"><div><div className="label">当前可确定</div><div className="block-text">{plain(selectedActive.analysis.rootCause||selectedActive.analysis.trigger)}</div></div><div><div className="label">缺少的外部信息</div><ul className="plain-list">{list(selectedActive.analysis.openQuestions).map((q,i)=><li key={i}>{oqNorm(q).question}</li>)}{!list(selectedActive.analysis.openQuestions).length&&<li className="muted">未列明</li>}</ul></div><div><div className="label">为何影响判断</div><div className="block-text">{plain(selectedActive.analysis.impact)}</div></div><div><div className="label">需要人工提供</div><div className="block-text">后端实现 / 外部接口行为 / 产品意图等仓库外事实；在 03 区一句话补充即可，Agent 将据此重新评估整个 Finding，而非机械填表。</div></div></div></div>}
       {selectedActive.analysis.proposal&&<div className="proposal space-top"><div className="between"><span className="eyebrow">RECOMMENDED APPROACH</span><Tag color={riskColor(selectedActive.analysis.proposal.fixRisk)}>修复风险 · {riskText[selectedActive.analysis.proposal.fixRisk]||selectedActive.analysis.proposal.fixRisk}</Tag></div><div className="proposal-title">{selectedActive.analysis.proposal.summary}</div><div className="block-text">{selectedActive.analysis.proposal.approach}</div><div className="label space-top">涉及文件</div><div className="row">{list(selectedActive.analysis.proposal.files).map((fp,i)=><Tag key={i}>{fp}</Tag>)}</div><div className="detail-grid space-top"><div><div className="label">预期变更</div><ul className="plain-list">{list(selectedActive.analysis.proposal.changes).map((c,i)=><li key={i}>{c}</li>)}{!list(selectedActive.analysis.proposal.changes).length&&<li className="muted">未提供</li>}</ul></div><div><div className="label">验证要求</div><ul className="plain-list">{list(selectedActive.analysis.proposal.verification).map((v,i)=><li key={i}>{v}</li>)}</ul></div></div></div>}
       <div className="label space-top">证据 · {list(selectedActive.analysis.evidence).length}</div>{list(selectedActive.analysis.evidence).map((ev,i)=><div className="evidence" key={i}><div className="row"><Tag>{evidenceText[ev.kind]||ev.kind}</Tag><span className="path mono">{ev.ref}</span></div><div className="block-text space-top">{ev.summary}</div></div>)}{!list(selectedActive.analysis.evidence).length&&<span className="muted small">无证据记录</span>}
      </div>
     </>}
    </div>
    <aside className="decision-rail">
     {selectedActive?<>
      <div className="detail-rail-title"><span className="idx">03</span>人工决策 · Decision</div>
       <DecisionZone f={selectedActive} decision={selectedDecision} state={selectedState} onChoose={chooseDecision} onNote={updateNote} onAnswer={setAnswer} onNext={nextUndecided} onWarn={m=>message.warning(m)}/>
     </>:<Alert type="info" showIcon message="平台已关闭 · 无需决策。只读展示，不进入 LocalStorage 授权或交接。"/>}
    </aside>
    </div></div>}
  </Modal>
 </main>
 <Modal open={!!closeTarget} title={closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'退回重评 · 填写理由':'关闭评论 · 填写理由'} width={520} okText={closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'提交':'确认关闭'} cancelText="取消" onCancel={()=>{setCloseTarget(null);setCloseReason('');}} onOk={()=>{if(!closeReason.trim()){message.warning(closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'退回重评必须填写理由':'关闭必须填写理由');return;}decideFor(closeTarget.id,closeTarget.mode,closeReason.trim());setCloseTarget(null);setCloseReason('');}}><TextArea rows={3} value={closeReason} onChange={e=>setCloseReason(e.target.value)} placeholder={closeTarget&&closeTarget.mode==='PROVIDE_INFO'?'为什么退回重评：agent 误读上下文 / 触发条件不可达 / 结论与事实不符…（理由将交给 Agent 重新评估整条 Finding）':'为什么关闭：误报 / 已在他处解决 / 本 MR 不处理（另单跟）…'}/></Modal>
 <Modal open={handoffOpen} title="Decision Envelope" onCancel={()=>setHandoffOpen(false)} width={760} footer={<Space><Button onClick={()=>setHandoffOpen(false)}>关闭</Button><Button type="primary" onClick={copyEnvelope}>复制 JSON</Button></Space>}>
  <p className="small muted">每个 active finding 生成一条决策；stale / invalid 写为 UNDECIDED，closed 不进入交接。</p><div className="row" style={{margin:'12px 0'}}><Tag>修复 {envelopeCounts.APPROVE}</Tag><Tag color="success">关闭 {envelopeCounts.CLOSE}</Tag><Tag>暂缓 {envelopeCounts.DEFER}</Tag><Tag color="warning">重评 {envelopeCounts.PROVIDE_INFO}</Tag><Tag>未决策 {envelopeCounts.UNDECIDED}</Tag></div><TextArea className="handoff-text" readOnly rows={16} value={envelopeText}/>
 </Modal>
 </ConfigProvider>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
</script>
</body>
</html>
